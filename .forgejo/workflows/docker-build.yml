name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --build-arg MODEL_ID=${{ vars.MODEL_ID || 'cross-encoder/ettin-reranker-400m-v1' }} \
            --build-arg DEVICE=${{ vars.DEVICE || 'cuda' }} \
            -t local/ettin-reranker:test \
            .

      - name: Inspect image
        run: |
          docker image inspect local/ettin-reranker:test --format '{{.Size}} bytes'
          docker history local/ettin-reranker:test

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned: ruff 0.16 changed its default rule set; bump the version deliberately.
        run: pip install "ruff==0.16.9"

      - name: Lint with ruff
        run: ruff check server.py

      - name: Check formatting with ruff
        run: ruff format --check server.py
  publish:
    needs: [docker-build,lint]
    if: github.event_name == 'release' && github.event.action == 'published' && github.server_url != 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@main
    runs-on: ubuntu-latest
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
